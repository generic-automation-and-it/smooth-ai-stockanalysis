# No workflow currently calls this composite action; the PR gate invokes
# run-level.sh / merge-coverage.sh directly. Remove this file if that
# remains true after WT-10-03.
name: Test with coverage (all levels)
description: >
  Compatibility composite that runs unit, component, and integration levels
  then merges coverage. Prefer calling run-level.sh from workflow steps so each
  level is a distinguishable check.

inputs:
  build-configuration:
    description: MSBuild configuration to test.
    required: false
    default: Release
  artifacts-root:
    description: Root folder for test and coverage artifacts.
    required: false
    default: artifacts
  dependency-timeout-seconds:
    description: Seconds to wait for Aspire-managed WireMock (integration level only).
    required: false
    default: "120"

runs:
  using: composite
  steps:
    - name: Run all test levels with coverage
      shell: bash
      env:
        BUILD_CONFIGURATION: ${{ inputs.build-configuration }}
        ARTIFACTS_ROOT: ${{ inputs.artifacts-root }}
        DEPENDENCY_TIMEOUT_SECONDS: ${{ inputs.dependency-timeout-seconds }}
      run: bash "${{ github.action_path }}/run.sh"
