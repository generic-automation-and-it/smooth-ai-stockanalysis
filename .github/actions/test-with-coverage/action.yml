name: Test with coverage
description: Run the ordered test suite with coverage and generate reports.

inputs:
  build-configuration:
    description: MSBuild configuration to test.
    required: false
    default: Release
  artifacts-root:
    description: Root folder for test and coverage artifacts.
    required: false
    default: artifacts

runs:
  using: composite
  steps:
    - name: Run tests with coverage
      shell: bash
      env:
        BUILD_CONFIGURATION: ${{ inputs.build-configuration }}
        ARTIFACTS_ROOT: ${{ inputs.artifacts-root }}
      run: bash "${{ github.action_path }}/run.sh"
