name: PR Gate

on:
  push:
    branches:
      - main
    paths:
      - Directory.Packages.props
      - Directory.Build.props
      - .editorconfig
      - .config/dotnet-tools.json
      - "*.slnx"
      - src/**
      - tests/**
      - .github/actions/**
      - .github/workflows/pr-gate.yml
  pull_request:
    branches:
      - main
    paths:
      - Directory.Packages.props
      - Directory.Build.props
      - .editorconfig
      - .config/dotnet-tools.json
      - "*.slnx"
      - src/**
      - tests/**
      - .github/actions/**
      - .github/workflows/pr-gate.yml
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      BUILD_CONFIGURATION: Release
      DOTNET_VERSION: 10.0.x
      ARTIFACTS_ROOT: artifacts
      DEPENDENCY_TIMEOUT_SECONDS: "120"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format whitespace smooth-ai-stockanalysis.slnx --verify-no-changes --no-restore

      - name: Build
        id: build
        run: dotnet build --configuration "$BUILD_CONFIGURATION" --no-restore

      # Levels run even when a previous level failed so the PR checks stay distinguishable.
      - name: Unit tests
        id: unit
        if: ${{ always() && !cancelled() && steps.build.outcome == 'success' }}
        run: bash .github/actions/test-with-coverage/run-level.sh unit

      - name: Component tests
        id: component
        if: ${{ always() && !cancelled() && steps.build.outcome == 'success' }}
        run: bash .github/actions/test-with-coverage/run-level.sh component

      - name: Integration tests
        id: integration
        if: ${{ always() && !cancelled() && steps.build.outcome == 'success' }}
        run: bash .github/actions/test-with-coverage/run-level.sh integration

      - name: Merge coverage
        if: ${{ always() && !cancelled() && steps.build.outcome == 'success' }}
        run: bash .github/actions/test-with-coverage/merge-coverage.sh

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f artifacts/coverage/SummaryGithub.md ]; then
            cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: artifacts/testresults/unit/
          if-no-files-found: warn

      - name: Upload component test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-component
          path: artifacts/testresults/component/
          if-no-files-found: warn

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: artifacts/testresults/integration/
          if-no-files-found: warn

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage/
          if-no-files-found: warn
