name: PR Gate

on:
  push:
    branches:
      - main
    paths:
      - Directory.Packages.props
      - Directory.Build.props
      - .editorconfig
      - .config/dotnet-tools.json
      - "*.slnx"
      - src/**
      - tests/**
      - .github/actions/**
      - .github/workflows/pr-gate.yml
      - .gitleaks.toml
  pull_request:
    branches:
      - main
    paths:
      - Directory.Packages.props
      - Directory.Build.props
      - .editorconfig
      - .config/dotnet-tools.json
      - "*.slnx"
      - src/**
      - tests/**
      - .github/actions/**
      - .github/workflows/pr-gate.yml
      - .gitleaks.toml
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      BUILD_CONFIGURATION: Release
      DOTNET_VERSION: 10.0.x
      ARTIFACTS_ROOT: artifacts
      DEPENDENCY_TIMEOUT_SECONDS: "120"
      # Secret scanner (WT-10-03, NFR-043 verification clause). Pinned by SHA so
      # the step runs identically on fork PRs (no secrets consumed) and the
      # installed binary + upstream default config are reviewable. See
      # .github/actions/secret-scan/scan.sh and .github/CI_AGENTS.md.
      GITLEAKS_VERSION: "8.27.2"
      GITLEAKS_SHA256: "141c3b2dede46d8b3a53b47116da756bd223decc0374797559a6b50ecba5590c"
      GITLEAKS_CONFIG_SHA256: "057620c6a131fe413c7f1ca949ad32c9d86765238cc70fa70a7aa235068bcfd3"

    steps:
      - name: Checkout
        # fetch-depth 0 so gitleaks can resolve the PR commit range via
        # --log-opts "origin/main..HEAD". A shallow clone would miss the merge
        # base and silently scan zero commits.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format whitespace smooth-ai-stockanalysis.slnx --verify-no-changes --no-restore

      - name: Build
        id: build
        run: dotnet build --configuration "$BUILD_CONFIGURATION" --no-restore

      # Secret scan runs after a successful Build so a credential fails fast
      # before the test levels spend their time. It scans the PR commit range
      # (origin/main..HEAD), not the full history; the blind spot is documented
      # in .github/CI_AGENTS.md and closed by WT-10-04's always-runs gate.
      # INVARIANT: like the test levels, this step honours the Build gate — it
      # runs only when Build succeeded. Do not relax to `!= 'failure'`.
      #
      # Timeout budget: 5 minutes comfortably covers a single-PR scan (a few
      # hundred commits) and a workflow_dispatch full-history scan for the
      # current repo size (~1k commits, <30s observed). Bump to 15 if the
      # history grows past ~10k commits, or split workflow_dispatch into its
      # own job with a longer budget.
      - name: Secret scan
        id: secret-scan
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        env:
          # Resolve the scan range from the event so it works on forks (where the
          # PR head ref is not a local branch) and on push to main. For
          # pull_request use base..head SHAs; for push use the before..after SHAs
          # (before = 0000...0000 on a new branch → scan the whole pushed range);
          # workflow_dispatch leaves it blank so scan.sh scans full history.
          SCAN_LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'push' && format('{0}..{1}', github.event.before, github.event.after) || '' }}
        run: bash .github/actions/secret-scan/scan.sh

      # Levels run even when a previous level failed so the PR checks stay distinguishable.
      #
      # INVARIANT: the gate is `steps.build.outcome == 'success'`, not "not failed".
      # Every level runs `dotnet test --no-build`, so without a successful Build there is
      # nothing to test and the levels would fail for a misleading reason. If you ever add
      # an `if:` to the Build step, outcome becomes 'skipped' and the levels skip with it —
      # that is deliberate. Do not relax this to `!= 'failure'`.
      - name: Unit tests
        id: unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: bash .github/actions/test-with-coverage/run-level.sh unit

      - name: Component tests
        id: component
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: bash .github/actions/test-with-coverage/run-level.sh component

      - name: Integration tests
        id: integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: bash .github/actions/test-with-coverage/run-level.sh integration

      - name: Merge coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: bash .github/actions/test-with-coverage/merge-coverage.sh

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f artifacts/coverage/SummaryGithub.md ]; then
            cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: artifacts/testresults/unit/
          if-no-files-found: warn

      - name: Upload component test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-component
          path: artifacts/testresults/component/
          if-no-files-found: warn

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: artifacts/testresults/integration/
          if-no-files-found: warn

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage/
          if-no-files-found: warn

      - name: Upload secret-scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: artifacts/secret-scan/report.json
          if-no-files-found: warn
